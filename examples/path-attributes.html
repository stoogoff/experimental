<script type="module">

import { directives, DIRECTIVES_LOG_KEY } from '../src/reactive/index.js'
import { setLogger, ConsoleLogger, LOG_LEVEL_INFO } from '../src/utils/logger.js'
import { isEmptyString, notEmptyString, notNull } from '../src/utils/assert.js'
import { Emittable } from '../src/utils/emittable.js'
import { ListStore } from './components/list-store.js'
import { list, model } from '../src/signals/index.js'


//setLogger(DIRECTIVES_LOG_KEY, ConsoleLogger, LOG_LEVEL_INFO)

const listStore = list([
	{ name: 'Zeus' },
	{ name: 'Hera' },
	{ name: 'Artemis' },
	{ name: 'Apollo' },
])

console.log(listStore, listStore.valueOf())

const objectStore = {
	name: 'Artemis',
	symbol: 'Arrow',
}

let externalValue = 'Hello'

directives.registerStore('list', listStore)
directives.registerStore('object', objectStore)

let current = 0
const names = ['Artemis', 'Hera', 'Athena', 'Demeter']

const formField = {
	data: {
		value: '',
	},

	computed: {
		hasError() {
			console.log('hasError', this.data.value)
			return isEmptyString(this.data.value)
		},
	},
}

directives.registerComponent('formField', formField)
directives.load(document.getElementById('mount'), {
	data: {
		person: {
			name: 'Demeter',
			symbol: 'Corn',
		},

		name: 'Athena',
		symbol: 'Owl',

		updateName: ''
	},

	deity: model({
		name: 'Hera',
		symbol: 'Sceptre',
	}),

	list: listStore,

	// this should go into component
	/*register(signal) {
		signal.on(() => this.emit('change'))
	}*/

	created() {
		/*listStore.on(() => {
			console.log('listStore change')
			this.emit('change')
		})*/
	},

	addToList(evt, context) {
		//if(notEmptyString(this.data.updateName)) {
			listStore.add({ name: 'Test' })
		//}
	},

	fromFunction(context, value) {
		if(notNull(value)) {
			externalValue = value
		}

		return externalValue
	},

	changeDeity() {
		this.deity.name.value = names[current++]

		if(current >= names.length) current = 0
	}
})

</script>
