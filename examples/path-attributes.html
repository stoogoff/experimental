<body>

<div id="mount">
	<div>
		<h3>Path properties</h3>
		<p>Name (data.person.name): <strong data-q-text="data.person.name"></strong></p>
		<p>Symbol (data.person.symbol): <strong data-q-text="data.person.symbol"></strong></p>
		<div>
			<input type="text" data-q-input="data.person.name" />
		</div>
	</div>
	<hr />
	<div>
		<h3>Natural properties</h3>
		<p>Name (name): <strong data-q-text="name"></strong></p>
		<p>Symbol (symbol): <strong data-q-text="symbol"></strong></p>
		<div>
			<input type="text" data-q-input="name" />
		</div>
	</div>
	<hr />
	<div>
		<h3>Data properties</h3>
		<p>Name (data.name): <strong data-q-text="data.name"></strong></p>
		<p>Symbol (data.symbol): <strong data-q-text="data.symbol"></strong></p>
		<div>
			<input type="text" data-q-input="data.name" />
		</div>
	</div>
	<hr />
	<!--div>
		<h3>Store path properties</h3>
		<p>Name (stores.object.name): <strong data-q-text="stores.object.name"></strong></p>
		<p>Symbol (stores.object.symbol): <strong data-q-text="stores.object.symbol"></strong></p>
		<div>
			<input type="text" data-q-input="stores.object.name" />
		</div>
	</div>
	<ul>

	<p data-q-html="fromFunction"></p>
	<input type="text" data-q-input="fromFunction" / -->

		<label>
			Label
			<input type="text" data-q-input="value" />
		</label>
		<div style="color: red" data-q-if="hasError">Has error</div>
	</div>
	<div data-q-component="formField">
		<label>

			<input type="text" data-q-input="value" />
		</label>
		<div style="color: red" data-q-if="hasError">Has error</div>

</div>

<script type="module">

import { directives, DIRECTIVES_LOG_KEY } from '../src/reactive/index.js'
import { setLogger, ConsoleLogger, LOG_LEVEL_INFO } from '../src/utils/logger.js'
import { isEmptyString, notEmptyString, notNull } from '../src/utils/assert.js'
import { Emittable } from '../src/utils/emittable.js'
import { ListStore } from './components/list-store.js'

setLogger(DIRECTIVES_LOG_KEY, ConsoleLogger, LOG_LEVEL_INFO)

const listStore = new ListStore([
	{ name: 'Zeus' },
	{ name: 'Hera' },
	{ name: 'Artemis' },
	{ name: 'Apollo' },
])

const objectStore = {
	name: 'Artemis',
	symbol: 'Arrow',
}

let externalValue = 'Hello'

directives.registerStore('list', listStore)
directives.registerStore('object', objectStore)

const formField = {
	data: {
		value: '',
	},

	computed: {
		hasError() {
			console.log('hasError', this.data.value)
			return isEmptyString(this.data.value)
		},
	},
}

directives.registerComponent('formField', formField)
directives.load(document.getElementById('mount'), {
	data: {
		person: {
			name: 'Demeter',
			symbol: 'Corn',
		},

		name: 'Athena',
		symbol: 'Owl',

		updateName: ''
	},

	name: 'Hera',
	symbol: 'Sceptre',

	addtoList(context, value) {
		if(notEmptyString(this.data.updateName)) {
			listStore.add({ name: this.data.updateName })
		}
	},

	fromFunction(context, value) {
		if(notNull(value)) {
			externalValue = value
		}

		return externalValue
	},
})

</script>

</body>
</html>
