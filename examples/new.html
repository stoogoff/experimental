class Signal extends EventTarget {
	#value

	constructor(value) {
		super()
		this.#value = value
	}

	get value() {
		return this.#value
	}

	set value(newValue) {
		if(this.value === newValue) return

		this.#value = newValue
		this.dispatchEvent(new CustomEvent('change', {
			detail: {
				value: this.value,
			},
		}))
	}

	on(fn) {
		this.addEventListener('change', fn)
	}

	off(fn) {
		this.removeEventListener('change', fn)
	}

	valueOf() {
		return this.value
	}

	toString() {
		return this.valueOf().toString()
	}
}

class Computed extends EventTarget {
	#signal

	constructor(fn, dependencies = []) {
		super()

		this.#signal = new Signal(fn())
		this.#signal.on((evt) => {
			this.dispatchEvent(new CustomEvent('change', {
				detail: { ...evt.detail }
			}))
		})

		for(const dependency of dependencies) {
			dependency.on(() => {
				this.#signal.value = fn()
			})
		}
	}

	get value() {
		return this.#signal.value
	}

	on(fn) {
		this.addEventListener('change', fn)
	}

	off(fn) {
		this.removeEventListener('change', fn)
	}	
}

class Model extends EventTarget {
	constructor(data) {
		super()

		const proxy = new Proxy(data, this)

		proxy.on = this.on.bind(this)
		proxy.off = this.off.bind(this)

		return proxy
	}

	get(target, prop, receiver) {
		return target[prop]
	}

	has(target, prop) {
		return prop in target
	}

	set(target, prop, value) {
		const oldValue = target[prop]

		if(oldValue === value) return true

		target[prop] = value

		this.dispatchEvent(new CustomEvent('change', {
			detail: {
				model: target
			}
		}))
		this.dispatchEvent(new CustomEvent(`change:${prop}`, {
			detail: {
				value
			}
		}))

		return true
	}

	on(fn, property) {
		this.addEventListener(property ? `change:${property}` : 'change', fn)
	}

	off(fn, property) {
		this.removeEventListener(property ? `change:${property}` : 'change', fn)
	}
}

class ObjectModel extends EventTarget {
	constructor(data) {
		super()

		Object.keys(data).forEach(prop => {
			this[prop] = new Signal(data[prop])
			this[prop].on(({ detail }) => {
				this.dispatchEvent(new CustomEvent('change', {
					detail: {
						model: this,
					}
				}))
				this.dispatchEvent(new CustomEvent(`change:${prop}`, {
					detail: {
						value: detail.value,
					}
				}))
			})
		})
	}

	on(fn) {
		this.addEventListener('change', fn)
	}

	off(fn) {
		this.removeEventListener('change', fn)
	}
}
